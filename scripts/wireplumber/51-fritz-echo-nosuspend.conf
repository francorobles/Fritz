# Fritz: never suspend the Echo Dot sink. When PipeWire suspends an idle
# Bluetooth sink it stops the A2DP stream, and the Echo Dot drops the link
# after a few minutes of no audio. Keeping the sink running streams silence.
monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
