# Fritz: the Pi only ever *sends* audio over Bluetooth (to the Echo Dot).
# Without this, the Pi also advertises itself as an A2DP sink, and the Echo
# can connect to it as "its" speaker. The link then comes up in the
# audio-gateway profile (Echo -> Pi) and no bluez_output sink is created.
# Dropping a2dp_sink / hfp_hf / hsp_hs leaves only the source roles.
monitor.bluez.properties = {
  bluez5.roles = [ a2dp_source hfp_ag hsp_ag ]
}
